# Local dev stack (Phase 0). Langfuse: use the free Langfuse Cloud tier to keep this light.
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092", "9644:9644"]
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]
  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/desk-local-pw
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j:/data]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: desk
      POSTGRES_DB: desk
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  qdrant:
  neo4j:
  pg:
