[project]
name = "research-desk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "numpy>=2",
  "rank-bm25>=0.2.2",
  "qdrant-client>=1.12",
  "fastembed>=0.4",
  "confluent-kafka>=2.5",
  "langgraph>=1.0",
  "mcp>=2.0",
  "yfinance>=0.2",
  "pypdf>=5",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]

[project.optional-dependencies]
# ruff pinned: its default rule set changes between releases, so CI must match local
dev = ["pytest>=8", "ruff==0.17.3"]

[project.scripts]
desk = "research_desk.cli:main"
sec-examiner-mcp = "research_desk.examiner.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
