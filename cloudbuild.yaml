# Cloud Build: build the one-container Examiner image (web app + API + champion model).
steps:
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]   # reads Dockerfile.serve.dockerignore
    args: ["build", "-f", "Dockerfile.serve", "-t", "$_IMAGE", "."]
images: ["$_IMAGE"]
options:
  machineType: E2_HIGHCPU_8
